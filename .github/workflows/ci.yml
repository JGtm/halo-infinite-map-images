name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # `himodule` et `ooz` exigent cgo et un compilateur C++ : présent sur les deux images.
      - run: go vet ./...
        env:
          CGO_ENABLED: "1"
      - run: go build ./...
        env:
          CGO_ENABLED: "1"
      - run: go test ./... -count=1
        env:
          CGO_ENABLED: "1"

  research:
    name: Vet des instruments research (compilation seule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet -tags=research ./...
        env:
          CGO_ENABLED: "1"
      # Les tests qui ouvrent le jeu (`gamefiles`) ne tournent pas ici (pas d'installation) : ils doivent compiler.
      - run: go vet -tags=gamefiles,research ./...
        env:
          CGO_ENABLED: "1"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
